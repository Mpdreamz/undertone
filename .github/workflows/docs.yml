name: docs

# The docs (docs-builder) with the landing page over their home page, published to GitHub Pages at
# https://mpdreamz.github.io/undertone/. scripts/docs.sh builds the same thing locally (mise run docs).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      # scripts/docs.sh, as `mise run docs` runs it: docs-builder with the site's own address (for canonical links
      # and the image social sites show; the docs-builder action cannot pass it), then the landing page and the
      # files docs-builder does not copy.
      - name: Build documentation
        run: scripts/docs.sh --noserve

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .artifacts/docs/html

      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
